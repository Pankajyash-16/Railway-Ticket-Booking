/* ===== PREMIUM BOOKING PAGE DESIGN ===== */
:root{
    --navy:#111827;
    --navy-2:#1f2937;
    --slate:#64748b;
    --line:#e2e8f0;
    --soft:#f8fafc;
    --white:#ffffff;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --success:#15803d;
    --shadow:0 18px 45px rgba(15,23,42,.10);
    --shadow-soft:0 8px 24px rgba(15,23,42,.07);
}

body{
    background:
        radial-gradient(circle at 8% 12%, rgba(37,99,235,.07), transparent 26%),
        radial-gradient(circle at 92% 30%, rgba(15,23,42,.05), transparent 28%),
        #eef2f6;
    color:#172033;
    line-height:1.5;
}

.booking-section{
    min-height:calc(100vh - 90px);
    padding:58px 20px 72px;
    position:relative;
}

.booking-section::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:5px;
    background:linear-gradient(90deg,#111827,#334155,#2563eb,#111827);
}

.booking-card{
    max-width:1000px;
    padding:0;
    background:rgba(255,255,255,.97);
    border:1px solid rgba(226,232,240,.95);
    border-radius:24px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.booking-card > h1{
    margin:0;
    padding:34px 40px 8px;
    font-size:32px;
    letter-spacing:-.7px;
    color:var(--navy);
}

.booking-card > .subtitle{
    margin:0;
    padding:0 40px 30px;
    color:var(--slate);
    font-size:15px;
}

#bookingForm{
    padding:0 40px 40px;
}

#bookingForm::before{
    content:"JOURNEY DETAILS";
    display:block;
    margin:0 -40px 26px;
    padding:15px 40px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#f8fafc;
    color:#475569;
    font-size:12px;
    font-weight:800;
    letter-spacing:1.6px;
}

.form-row{
    gap:22px;
}

.form-group{
    margin-bottom:22px;
}

label{
    color:#334155;
    font-size:13px;
    font-weight:800;
    letter-spacing:.2px;
}

input,select{
    padding:14px 15px;
    border:1px solid #d6dee8;
    border-radius:12px;
    background:#fff;
    color:#172033;
    box-shadow:0 2px 5px rgba(15,23,42,.025);
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}

input:hover,select:hover{
    border-color:#b8c4d4;
}

input:focus,select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(37,99,235,.10);
    transform:translateY(-1px);
}

.passenger-card{
    margin-top:18px;
    padding:24px;
    background:linear-gradient(145deg,#ffffff,#f8fafc);
    border:1px solid #e2e8f0;
    border-left:4px solid var(--accent);
    border-radius:16px;
    box-shadow:var(--shadow-soft);
    position:relative;
    overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.passenger-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-45px;
    top:-45px;
    border-radius:50%;
    background:rgba(37,99,235,.05);
}

.passenger-card:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(15,23,42,.10);
}

.passenger-card h3{
    margin:0 0 20px;
    color:var(--navy);
    font-size:18px;
    position:relative;
    z-index:1;
}

.passenger-card h3::before{
    content:"";
    display:inline-block;
    width:7px;
    height:7px;
    margin:0 9px 3px 0;
    border-radius:50%;
    background:var(--accent);
}

.book-btn{
    margin-top:8px;
    padding:16px 20px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--navy),#263449);
    box-shadow:0 10px 22px rgba(15,23,42,.18);
    letter-spacing:.2px;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.book-btn:hover{
    opacity:1;
    background:linear-gradient(135deg,#172033,var(--accent-dark));
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(15,23,42,.22);
}

.book-btn:active{
    transform:translateY(0);
}

.result{
    margin:0;
    padding:0 40px 42px;
}

.booking-summary{
    padding:26px;
    background:linear-gradient(145deg,#f8fafc,#ffffff);
    border:1px solid #dbe4ef;
    border-radius:18px;
    box-shadow:var(--shadow-soft);
    margin-bottom:26px;
}

.booking-summary h2{
    margin-bottom:18px;
    color:var(--navy);
    font-size:24px;
}

.booking-summary p{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:9px 0;
    border-bottom:1px dashed #e2e8f0;
    color:#475569;
}

.booking-summary p:last-child{
    border-bottom:0;
}

.booking-summary strong{
    color:#1e293b;
}

.ticket{
    margin-top:20px;
    border:1px solid #d9e2ec;
    border-radius:18px;
    box-shadow:var(--shadow-soft);
    overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease;
}

.ticket:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 32px rgba(15,23,42,.10);
}

.ticket-header{
    background:linear-gradient(135deg,#111827,#334155);
    padding:17px 22px;
    text-align:left;
    font-size:18px;
    letter-spacing:.3px;
    position:relative;
}

.ticket-header::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    background:#2563eb;
}

.ticket-body{
    padding:23px;
    background:#fff;
}

.ticket-body p{
    margin-bottom:10px;
    color:#475569;
}

.ticket-body strong{
    color:#1e293b;
}

.ticket-body hr{
    border:0;
    border-top:1px dashed #dbe3ed;
    margin:17px 0;
}

.ticket-footer{
    padding:16px 22px;
    background:#f8fafc;
    border-top:1px solid #e5eaf0;
}

.seat{
    color:var(--accent);
    background:#eff6ff;
    border:1px solid #dbeafe;
    padding:7px 12px;
    border-radius:9px;
}

.ticket-id{
    color:#334155;
    font-family:monospace;
}

.total-fare{
    margin:25px 0 8px;
    padding:18px;
    color:#166534;
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    border-radius:14px;
    font-size:24px;
}

.success-message{
    margin-top:10px;
    color:var(--success);
    font-size:14px;
}

footer{
    border-top:1px solid #2b3139;
}

.creator-name{
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #3b4149;
    text-align:center;
    font-size:15px;
    color:#fff;
}

@media (max-width:700px){
    .booking-section{
        padding:34px 12px 45px;
    }

    .booking-card{
        border-radius:18px;
    }

    .booking-card > h1{
        padding:26px 20px 7px;
        font-size:25px;
    }

    .booking-card > .subtitle{
        padding:0 20px 23px;
        font-size:14px;
    }

    #bookingForm{
        padding:0 20px 28px;
    }

    #bookingForm::before{
        margin:0 -20px 22px;
        padding:13px 20px;
        font-size:11px;
    }

    .form-row{
        flex-direction:column;
        gap:0;
    }

    .passenger-card{
        padding:19px;
    }

    .result{
        padding:0 20px 30px;
    }

    .booking-summary{
        padding:20px;
    }

    .booking-summary p{
        flex-direction:column;
        gap:2px;
    }

    .ticket-body{
        padding:20px;
    }

    .ticket-footer{
        flex-direction:column;
        align-items:flex-start;
    }

    .total-fare{
        font-size:21px;
    }
}

    letter-spacing:.2px;
}
.book-btn{
    margin-top:12px;
    height:55px;
    border-radius:14px;
    background:linear-gradient(135deg,#25282c,#4b5056);
    box-shadow:0 12px 25px rgba(37,40,44,.20);
    font-size:16px;
    letter-spacing:.2px;
    transition:.2s ease;
}
.book-btn:hover{
    opacity:1;
    transform:translateY(-2px);
    box-shadow:0 16px 30px rgba(37,40,44,.25);
}
.book-btn:active{transform:translateY(0)}
.result{margin-top:34px}
.booking-summary{
    padding:27px;
    background:#e9eaec;
    border:1px solid #cfd2d5;
    border-radius:18px;
    box-shadow:0 8px 22px rgba(31,35,40,.07);
}
.booking-summary h2{
    color:#25292e;
}
.ticket{
    border:1px solid #cfd3d6;
    border-radius:18px;
    background:#fff;
    box-shadow:0 12px 30px rgba(31,35,40,.10);
    transition:.2s ease;
}
.ticket:hover{
    transform:translateY(-2px);
    box-shadow:0 17px 34px rgba(31,35,40,.14);
}
.ticket-header{
    background:linear-gradient(135deg,#292d32,#565b61)!important;
    padding:18px 22px;
    text-align:left;
    font-size:18px;
    letter-spacing:.2px;
    position:relative;
}
.ticket-header:after{
    content:"";
    position:absolute;
    left:22px;right:22px;bottom:0;
    height:2px;
    background:#9da2a7;
}
.ticket-body{padding:24px}
.ticket-body p{color:#555a60;margin-bottom:11px}
.ticket-body p strong{color:#292d32}
.ticket-footer{
    border-top:1px dashed #cdd0d3;
    padding:17px 22px;
    background:#f0f1f2;
}
.seat,.ticket-id{color:#3f444a}
.total-fare{
    margin-top:25px;
    padding:17px;
    border-radius:14px;
    background:#292d32;
    color:#fff!important;
    font-size:22px;
    box-shadow:0 10px 22px rgba(31,35,40,.16);
}
.success-message{
    color:#4a5056;
    font-size:14px;
}
.creator-name{
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #444;
    text-align:center;
    font-size:14px;
    color:#fff;
}
@media(max-width:700px){
    .booking-section{padding:42px 13px 55px}
    .booking-card{padding:29px 18px;border-radius:21px}
    .booking-card h1{font-size:28px}
    .form-row{flex-direction:column;gap:0}
    .passenger-card{padding:22px 17px 7px}
    .ticket-body{padding:19px}
    .ticket-footer{flex-direction:column}
}

    </style>

</head>


<body>


    <header>

        <div class="logo">
            Railway Ticket Booking🚂
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="booking.html">
                Book Ticket
            </a>

            <a href="about.html">
                About
            </a>
            <a href="help.html">Help</a>

        </nav>

    </header>


    <section class="booking-section">


        <div class="booking-card">


            <h1>
                Book Railway Ticket
            </h1>


            <p class="subtitle">
                Enter your journey and passenger details
            </p>


            <form id="bookingForm">


                <!-- FROM AND TO -->

                <div class="form-row">


                    <div class="form-group">

                        <label>
                            From Station
                        </label>

                        <select id="from" required>

                            <option value="">
                                Select Station
                            </option>

                            <option>
                                New Delhi
                            </option>

                            <option>
                                Ghaziabad
                            </option>

                            <option>
                                Kanpur Central
                            </option>

                            <option>
                                Lucknow
                            </option>

                            <option>
                                Agra Cantt
                            </option>

                            <option>
                                Bhopal
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            To Station
                        </label>

                        <select id="to" required>

                            <option value="">
                                Select Station
                            </option>

                            <option>
                                New Delhi
                            </option>

                            <option>
                                Ghaziabad
                            </option>

                            <option>
                                Kanpur Central
                            </option>

                            <option>
                                Lucknow
                            </option>

                            <option>
                                Agra Cantt
                            </option>

                            <option>
                                Bhopal
                            </option>

                        </select>

                    </div>


                </div>


                <!-- DATE AND CLASS -->

                <div class="form-row">


                    <div class="form-group">

                        <label>
                            Journey Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Travel Class
                        </label>

                        <select
                            id="travelClass"
                            required
                        >

                            <option value="">
                                Select Class
                            </option>

                            <option>
                                Sleeper (SL)
                            </option>

                            <option>
                                AC 3 Tier (3A)
                            </option>

                            <option>
                                AC 2 Tier (2A)
                            </option>

                            <option>
                                First AC (1A)
                            </option>

                        </select>

                    </div>


                </div>


                <!-- NUMBER OF PASSENGERS -->

                <div class="form-group">

                    <label>
                        Number of Passengers
                    </label>

                    <input
                        type="number"
                        id="passengers"
                        min="1"
                        max="20"
                        value="1"
                        required
                    >

                </div>


                <!-- PASSENGER DETAILS -->

                <div id="passengerDetails"></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="book-btn"
                >
                    Search & Book Train
                </button>


            </form>


            <!-- RESULT -->

            <div
                id="result"
                class="result"
            ></div>


        </div>


    </section>


    <footer>

        <p>
            Railway Ticket Booking Simulation
        </p>

        <p>
            B.Tech First Year Mini Project
        </p>
         <div class="creator-name">
    Designed & Developed by: Pankaj Ahirwar
</div>

    </footer>


    <script>


        /*
         * Passenger input and container
         */

        const passengerInput =
            document.getElementById(
                "passengers"
            );


        const passengerDetails =
            document.getElementById(
                "passengerDetails"
            );


        /*
         * Create passenger forms
         */

        function createPassengerFields() {


            let count =
                parseInt(
                    passengerInput.value
                );


            if (
                isNaN(count) ||
                count < 1
            ) {

                count = 1;

            }


            if (count > 20) {

                count = 20;

            }


            passengerInput.value = count;


            passengerDetails.innerHTML = "";


            /*
             * Create fields for
             * every passenger
             */

            for (
                let i = 1;
                i <= count;
                i++
            ) {


                passengerDetails.innerHTML += `

                    <div class="passenger-card">

                        <h3>
                            Passenger ${i}
                        </h3>


                        <div class="form-group">

                            <label>
                                Passenger Name
                            </label>

                            <input
                                type="text"
                                id="name${i}"
                                placeholder="Enter passenger ${i} name"
                                required
                            >

                        </div>


                        <div class="form-row">


                            <div class="form-group">

                                <label>
                                    Age
                                </label>

                                <input
                                    type="number"
                                    id="age${i}"
                                    min="1"
                                    max="100"
                                    placeholder="Enter age"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label>
                                    Gender
                                </label>

                                <select
                                    id="gender${i}"
                                    required
                                >

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option>
                                        Male
                                    </option>

                                    <option>
                                        Female
                                    </option>

                                    <option>
                                        Other
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>

                `;

            }

        }
        /*
         * Create first passenger
         * form when page opens
         */
        createPassengerFields();
        /*
         * Create new passenger
         * fields when number changes
         */

        passengerInput.addEventListener(
            "change",
            createPassengerFields
        );
        /*
         * Booking form
         */

        document
        .getElementById("bookingForm")
        .addEventListener(
            "submit",
            function(event) {


                event.preventDefault();


                /*
                 * Journey details
                 */

                const from =
                    document
                    .getElementById("from")
                    .value;


                const to =
                    document
                    .getElementById("to")
                    .value;


                const date =
                    document
                    .getElementById("date")
                    .value;


                const travelClass =
                    document
                    .getElementById(
                        "travelClass"
                    )
                    .value;


                const passengerCount =
                    parseInt(
                        document
                        .getElementById(
                            "passengers"
                        )
                        .value
                    );
                /*
                 * Check stations
                 */

                if(from === to) {

                    alert(
                        "From Station and To Station cannot be the same."
                    );

                    return;
                }
                /*
                 * Select train automatically from route
                 * Sample data for this college project
                 */
                function getTrainDetails(from, to) {
                    const routes = {
                        "Ghaziabad|New Delhi": { name: "Ghaziabad Intercity Express", number: "14001" },
                        "New Delhi|Ghaziabad": { name: "New Delhi Intercity Express", number: "14002" },
                        "New Delhi|Kanpur Central": { name: "Kanpur Shatabdi Express", number: "12034" },
                        "Kanpur Central|New Delhi": { name: "Kanpur Shatabdi Express", number: "12033" },
                        "New Delhi|Lucknow": { name: "Lucknow Shatabdi Express", number: "12004" },
                        "Lucknow|New Delhi": { name: "Lucknow Shatabdi Express", number: "12003" },
                        "New Delhi|Agra Cantt": { name: "Taj Express", number: "12280" },
                        "Agra Cantt|New Delhi": { name: "Taj Express", number: "12279" },
                        "New Delhi|Bhopal": { name: "Bhopal Shatabdi Express", number: "12001" },
                        "Bhopal|New Delhi": { name: "Bhopal Shatabdi Express", number: "12002" },
                        "Ghaziabad|Kanpur Central": { name: "Ganga Yamuna Express", number: "12401" },
                        "Kanpur Central|Ghaziabad": { name: "Ganga Yamuna Express", number: "12402" },
                        "Ghaziabad|Lucknow": { name: "Awadh Express", number: "15001" },
                        "Lucknow|Ghaziabad": { name: "Awadh Express", number: "15002" },
                        "Ghaziabad|Agra Cantt": { name: "Agra Intercity Express", number: "14201" },
                        "Agra Cantt|Ghaziabad": { name: "Agra Intercity Express", number: "14202" },
                        "Ghaziabad|Bhopal": { name: "Narmada Express", number: "18233" },
                        "Bhopal|Ghaziabad": { name: "Narmada Express", number: "18234" },
                        "Kanpur Central|Lucknow": { name: "Kanpur Lucknow Intercity", number: "12179" },
                        "Lucknow|Kanpur Central": { name: "Kanpur Lucknow Intercity", number: "12180" },
                        "Kanpur Central|Agra Cantt": { name: "Gomti Express", number: "12419" },
                        "Agra Cantt|Kanpur Central": { name: "Gomti Express", number: "12420" },
                        "Kanpur Central|Bhopal": { name: "Bundelkhand Express", number: "11107" },
                        "Bhopal|Kanpur Central": { name: "Bundelkhand Express", number: "11108" },
                        "Lucknow|Agra Cantt": { name: "Lucknow Agra Express", number: "12179" },
                        "Agra Cantt|Lucknow": { name: "Lucknow Agra Express", number: "12180" },
                        "Lucknow|Bhopal": { name: "Lucknow Bhopal Express", number: "12511" },
                        "Bhopal|Lucknow": { name: "Lucknow Bhopal Express", number: "12512" },
                        "Agra Cantt|Bhopal": { name: "Agra Bhopal Express", number: "12198" },
                        "Bhopal|Agra Cantt": { name: "Agra Bhopal Express", number: "12197" }
                    };

                    const key = from + "|" + to;
                    return routes[key] || {
                        name: from + " - " + to + " Express",
                        number: "13001"
                    };
                }

                const train = getTrainDetails(from, to);
                const trainName = train.name;
                const trainNumber = train.number;

                /*
                 * Train timing
                 * Sample timings for this college project
                 */
                function getTrainTiming(from, to) {
                    const timings = {
                        "Ghaziabad|New Delhi": { departure: "06:30 AM", arrival: "07:15 AM" },
                        "New Delhi|Ghaziabad": { departure: "06:00 PM", arrival: "06:45 PM" },
                        "New Delhi|Kanpur Central": { departure: "06:00 AM", arrival: "11:00 AM" },
                        "Kanpur Central|New Delhi": { departure: "05:30 PM", arrival: "10:30 PM" },
                        "New Delhi|Lucknow": { departure: "06:10 AM", arrival: "12:25 PM" },
                        "Lucknow|New Delhi": { departure: "03:30 PM", arrival: "09:45 PM" },
                        "New Delhi|Agra Cantt": { departure: "07:10 AM", arrival: "10:05 AM" },
                        "Agra Cantt|New Delhi": { departure: "05:00 PM", arrival: "07:55 PM" },
                        "New Delhi|Bhopal": { departure: "06:00 AM", arrival: "02:30 PM" },
                        "Bhopal|New Delhi": { departure: "03:30 PM", arrival: "12:00 AM" },
                        "Ghaziabad|Kanpur Central": { departure: "06:20 AM", arrival: "11:20 AM" },
                        "Kanpur Central|Ghaziabad": { departure: "04:30 PM", arrival: "09:30 PM" },
                        "Ghaziabad|Lucknow": { departure: "05:50 AM", arrival: "12:15 PM" },
                        "Lucknow|Ghaziabad": { departure: "04:00 PM", arrival: "10:25 PM" },
                        "Ghaziabad|Agra Cantt": { departure: "07:00 AM", arrival: "10:00 AM" },
                        "Agra Cantt|Ghaziabad": { departure: "05:15 PM", arrival: "08:15 PM" },
                        "Ghaziabad|Bhopal": { departure: "05:45 AM", arrival: "02:15 PM" },
                        "Bhopal|Ghaziabad": { departure: "04:00 PM", arrival: "12:30 AM" },
                        "Kanpur Central|Lucknow": { departure: "08:00 AM", arrival: "10:00 AM" },
                        "Lucknow|Kanpur Central": { departure: "05:00 PM", arrival: "07:00 PM" },
                        "Kanpur Central|Agra Cantt": { departure: "07:30 AM", arrival: "12:00 PM" },
                        "Agra Cantt|Kanpur Central": { departure: "04:30 PM", arrival: "09:00 PM" },
                        "Kanpur Central|Bhopal": { departure: "06:00 AM", arrival: "04:00 PM" },
                        "Bhopal|Kanpur Central": { departure: "05:00 PM", arrival: "03:00 AM" },
                        "Lucknow|Agra Cantt": { departure: "06:30 AM", arrival: "12:00 PM" },
                        "Agra Cantt|Lucknow": { departure: "04:00 PM", arrival: "09:30 PM" },
                        "Lucknow|Bhopal": { departure: "07:00 AM", arrival: "05:00 PM" },
                        "Bhopal|Lucknow": { departure: "06:00 PM", arrival: "04:00 AM" },
                        "Agra Cantt|Bhopal": { departure: "06:30 AM", arrival: "04:30 PM" },
                        "Bhopal|Agra Cantt": { departure: "05:30 PM", arrival: "03:30 AM" }
                    };

                    return timings[from + "|" + to] || {
                        departure: "08:00 AM",
                        arrival: "04:00 PM"
                    };
                }

                const timing = getTrainTiming(from, to);
                const departureTime = timing.departure;
                const arrivalTime = timing.arrival;

                /*
                 * Distance based simulated fare
                 * Starting fares set by project owner:
                 * SL = 350, AC 3 = 700, AC 2 = 900, AC 1 = 1100
                 */

                const distanceMap = {
                    "New Delhi|Ghaziabad": 25,
                    "Ghaziabad|New Delhi": 25,
                    "New Delhi|Agra Cantt": 195,
                    "Agra Cantt|New Delhi": 195,
                    "New Delhi|Kanpur Central": 440,
                    "Kanpur Central|New Delhi": 440,
                    "New Delhi|Lucknow": 510,
                    "Lucknow|New Delhi": 510,
                    "New Delhi|Bhopal": 700,
                    "Bhopal|New Delhi": 700,
                    "Ghaziabad|Agra Cantt": 170,
                    "Agra Cantt|Ghaziabad": 170,
                    "Ghaziabad|Kanpur Central": 415,
                    "Kanpur Central|Ghaziabad": 415,
                    "Ghaziabad|Lucknow": 485,
                    "Lucknow|Ghaziabad": 485,
                    "Ghaziabad|Bhopal": 675,
                    "Bhopal|Ghaziabad": 675,
                    "Agra Cantt|Kanpur Central": 290,
                    "Kanpur Central|Agra Cantt": 290,
                    "Agra Cantt|Lucknow": 340,
                    "Lucknow|Agra Cantt": 340,
                    "Agra Cantt|Bhopal": 500,
                    "Bhopal|Agra Cantt": 500,
                    "Kanpur Central|Lucknow": 90,
                    "Lucknow|Kanpur Central": 90,
                    "Kanpur Central|Bhopal": 650,
                    "Bhopal|Kanpur Central": 650,
                    "Lucknow|Bhopal": 600,
                    "Bhopal|Lucknow": 600
                };

                const routeKey = from + "|" + to;
                const distance = distanceMap[routeKey] || 500;

                let startingFare;
                let distanceCharge;

                if (travelClass === "Sleeper (SL)") {
                    startingFare = 350;
                    distanceCharge = 100;
                }
                else if (travelClass === "AC 3 Tier (3A)") {
                    startingFare = 700;
                    distanceCharge = 125;
                }
                else if (travelClass === "AC 2 Tier (2A)") {
                    startingFare = 900;
                    distanceCharge = 150;
                }
                else {
                    startingFare = 1100;
                    distanceCharge = 200;
                }

                /*
                 * Every extra 100 km increases the fare.
                 * The minimum fare always remains the starting fare.
                 */
                const distanceBlocks = Math.max(0, Math.ceil((distance - 50) / 100));
                const farePerPassenger = startingFare + (distanceBlocks * distanceCharge);


                /*
                 * Total fare
                 */

                const totalFare =
                    farePerPassenger *
                    passengerCount;


                /*
                 * One PNR for
                 * complete booking
                 */

                const pnr =
                    Math.floor(
                        1000000000 +
                        Math.random() *
                        9000000000
                    );


                /*
                 * Generate all tickets
                 */

                let allTickets = "";


                for (
                    let i = 1;
                    i <= passengerCount;
                    i++
                ) {


                    /*
                     * Passenger details
                     */

                    const name =
                        document
                        .getElementById(
                            `name${i}`
                        )
                        .value
                        .trim();


                    const age =
                        document
                        .getElementById(
                            `age${i}`
                        )
                        .value;


                    const gender =
                        document
                        .getElementById(
                            `gender${i}`
                        )
                        .value;


                    /*
                     * Different seat
                     */

                    let seatPrefix = "S1";


                    if (
                        travelClass ===
                        "AC 3 Tier (3A)"
                    ) {

                        seatPrefix = "B1";

                    }

                    else if (
                        travelClass ===
                        "AC 2 Tier (2A)"
                    ) {

                        seatPrefix = "A1";

                    }

                    else if (
                        travelClass ===
                        "First AC (1A)"
                    ) {

                        seatPrefix = "H1";

                    }


                    const seatNumber =
                        seatPrefix +
                        "-" +
                        String(i)
                        .padStart(2, "0");


                    /*
                     * Unique ticket ID
                     */

                    const ticketId =
                        "TKT" +
                        Date.now() +
                        i;


                    /*
                     * Create separate ticket
                     */

                    allTickets += `

                        <div class="ticket">


                            <div class="ticket-header">

                                Railway Ticket

                            </div>


                            <div class="ticket-body">


                                <p>

                                    <strong>
                                        Ticket:
                                    </strong>

                                    ${i}
                                    of
                                    ${passengerCount}

                                </p>


                                <p>

                                    <strong>
                                        Ticket ID:
                                    </strong>

                                    <span class="ticket-id">
                                        ${ticketId}
                                    </span>

                                </p>


                                <p>

                                    <strong>
                                        PNR Number:
                                    </strong>

                                    ${pnr}

                                </p>


                                <hr>


                                <p>

                                    <strong>
                                        Train:
                                    </strong>

                                    ${trainName}

                                </p>


                                <p>

                                    <strong>
                                        Train Number:
                                    </strong>

                                    ${trainNumber}

                                </p>

                                <p>

                                    <strong>
                                        Departure Time:
                                    </strong>

                                    ${departureTime}

                                </p>


                                <p>

                                    <strong>
                                        Arrival Time:
                                    </strong>

                                    ${arrivalTime}

                                </p>


                                <p>

                                    <strong>
                                        From:
                                    </strong>

                                    ${from}

                                </p>


                                <p>

                                    <strong>
                                        To:
                                    </strong>

                                    ${to}

                                </p>


                                <p>

                                    <strong>
                                        Journey Date:
                                    </strong>

                                    ${date}

                                </p>


                                <p>

                                    <strong>
                                        Class:
                                    </strong>

                                    ${travelClass}

                                </p>


                                <hr>


                                <p>

                                    <strong>
                                        Passenger Name:
                                    </strong>

                                    ${name}

                                </p>


                                <p>

                                    <strong>
                                        Age:
                                    </strong>

                                    ${age}

                                </p>


                                <p>

                                    <strong>
                                        Gender:
                                    </strong>

                                    ${gender}

                                </p>


                            </div>


                            <div class="ticket-footer">


                                <span class="seat">

                                    Seat:
                                    ${seatNumber}

                                </span>


                                <span>

                                    Fare:
                                    ₹${farePerPassenger}

                                </span>


                            </div>


                        </div>

                    `;

                }


                /*
                 * Show complete booking
                 */

                document
                .getElementById("result")
                .innerHTML = `


                    <div class="booking-summary">


                        <h2>
                            Booking Confirmed
                        </h2>


                        <hr>


                        <p>

                            <strong>
                                PNR Number:
                            </strong>

                            ${pnr}

                        </p>


                        <p>

                            <strong>
                                Train:
                            </strong>

                            ${trainName}

                        </p>


                        <p>

                            <strong>
                                Train Number:
                            </strong>

                            ${trainNumber}

                        </p>

                                <p>

                                    <strong>
                                        Departure Time:
                                    </strong>

                                    ${departureTime}

                                </p>


                                <p>

                                    <strong>
                                        Arrival Time:
                                    </strong>

                                    ${arrivalTime}

                                </p>


                        <p>

                            <strong>
                                From:
                            </strong>

                            ${from}

                        </p>


                        <p>

                            <strong>
                                To:
                            </strong>

                            ${to}

                        </p>


                        <p>

                            <strong>
                                Journey Date:
                            </strong>

                            ${date}

                        </p>


                        <p>

                            <strong>
                                Class:
                            </strong>

                            ${travelClass}

                        </p>


                        <p>

                            <strong>
                                Total Tickets:
                            </strong>

                            ${passengerCount}

                        </p>


                    </div>


                    ${allTickets}


                    <h2 class="total-fare">

                        Total Fare:
                        ₹${totalFare}

                    </h2>


                    <p class="success-message">

                        ${passengerCount}
                        ticket(s) generated successfully.

                    </p>


                `;


            }
        );


    </script>


</body>

</html>
